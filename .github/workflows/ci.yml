name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Production host admission and private ACL checks are Darwin-specific.
    # Keep the deterministic source suite on a hosted Apple Silicon runner;
    # real Tart/Softnet and destructive lifecycle qualification stay local.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

      - name: Check generic golden source transitions
        shell: bash
        run: |
          bash guest/ubuntu-24.04-arm64/tests/render-golden-seed.sh
          bash guest/ubuntu-24.04-arm64/tests/finalize-golden.sh
          bash guest/ubuntu-24.04-arm64/tests/remaster-golden-iso.sh
          python3 guest/ubuntu-24.04-arm64/tests/install_chatgpt_test.py
          python3 guest/ubuntu-24.04-arm64/tests/efi_device_wait_test.py
          python3 guest/ubuntu-24.04-arm64/tests/service_start_wait_test.py
          python3 guest/ubuntu-24.04-arm64/tests/launch_chatgpt_test.py

      - name: Check controlled clipboard helpers without a VM
        shell: bash
        run: |
          python3 guest/ubuntu-24.04-arm64/tests/clipboard_test.py
          bash host/clipboard-menu/test.sh
          python3 tools/n1-qualification/listener_test.py
          python3 tools/n1-qualification/followup_tcp_verdict_test.py
          python3 tools/n1-qualification/clipboard_diagnostic_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 tools/n1-qualification/guest_metadata_observer_test.py
          python3 tools/n1-softnet/test_verify_cli.py tools/n1-softnet/verify_cli.py

      - name: Set up Node for synthetic demo checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Check synthetic workspace edits
        run: node --test examples/v0.2/synthetic-project.test.js

      - name: Require a module for tracked Go source
        shell: bash
        run: |
          if git ls-files -- '*.go' | grep -q . && [ ! -f go.mod ]; then
            echo 'tracked Go source requires go.mod' >&2
            exit 1
          fi

      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify alpha guest and VM helper sources
        if: ${{ hashFiles('go.mod') != '' }}
        shell: bash
        run: |
          python3 guest/ubuntu-24.04-arm64/tests/recipe_prepare_test.py
          python3 tools/alpha-inspector/fixture_contract_test.py
          python3 tools/alpha-inspector/kernel_image_test.py
          python3 tools/alpha-inspector/pack_initramfs_test.py
          python3 tools/alpha-inspector/run_boot_probe_test.py
          python3 tools/alpha-formatter/pack_initramfs_test.py
          python3 tools/alpha-vm-queue-test.py
          bash tools/alpha-inspector/disk_admission_test.sh
          scratch="$(mktemp -d "$RUNNER_TEMP/boxwarden-alpha-source.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          python3 tools/alpha-formatter/bind_root.py /private/tmp/boxwarden-alpha-ci-state alpha "$scratch/binding.swift"
          swiftc -module-cache-path "$scratch/inspector-swift-cache" \
            -o "$scratch/alpha-inspector-host" tools/alpha-inspector/main.swift tools/alpha-inspector/boot.swift
          swiftc -D MANAGED_BOUND -module-cache-path "$scratch/formatter-swift-cache" \
            -o "$scratch/alpha-formatter-host" tools/alpha-formatter/main.swift tools/alpha-formatter/boot.swift "$scratch/binding.swift"
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o "$scratch/alpha-inspector-guest" ./tools/alpha-inspector/guest
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o "$scratch/alpha-formatter-guest" ./tools/alpha-formatter/guest

      - name: Verify gofmt
        if: ${{ hashFiles('go.mod') != '' }}
        run: test -z "$(gofmt -l $(git ls-files -- '*.go'))"

      - name: Test
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test ./...

      - name: Test with race detector
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test -race ./...

      - name: Verify candidate admission and lifecycle build
        run: |
          go test -race -tags n1candidate ./...
          go vet -tags n1candidate ./...
          go build -tags n1candidate -o "$RUNNER_TEMP/boxwarden-n1" ./cmd/boxwarden

      - name: Verify clipboard diagnostic tags with synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          packages=(./internal/execx ./internal/clipboarddiag ./internal/guestproto ./internal/sshx
            ./internal/sessionruntime ./internal/supervisor ./internal/session
            ./internal/architecture ./cmd/boxwarden ./cmd/boxwarden-n1-clipboard-diagnostic)
          pattern='Clipboard|Diagnostic|Recorder|Operation|StrictReceipt|HostCLI|FrozenPython|Maximal|IncompleteCollection|PublicationRejects|PublicationWitness|StrictStderr|Slice'
          for tags in n1clipboarddiagnostic n1diagnostic,n1clipboarddiagnostic; do
            go test -race -tags "$tags" "${packages[@]}" -run "$pattern" -count=1
            go vet -tags "$tags" "${packages[@]}"
            go build -tags "$tags" -o "$RUNNER_TEMP/boxwarden-clipboard-${tags}" ./cmd/boxwarden
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags "$tags" \
              -trimpath -buildvcs=false -ldflags=-buildid= \
              -o "$RUNNER_TEMP/boxwarden-clipboard-helper-${tags}" ./cmd/boxwarden-n1-clipboard-diagnostic
          done
          go test -tags n1candidate,n1clipboarddiagnostic ./cmd/boxwarden \
            -run '^TestN1ClipboardDiagnosticForbiddenInDefaultAndCanonical$' -count=1

      - name: Verify diagnostic artifact admission and shared lifetime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP:?}/boxwarden-n1-diagnostic-ci.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          python3 -B tools/n1-diagnostic-softnet/test_build.py
          packages=(./internal/hostx ./internal/backend/tart ./internal/architecture ./cmd/boxwarden
            ./internal/networkdiag ./internal/session ./internal/sessionruntime
            ./internal/supervisor ./internal/config ./internal/serialx)
          for tags in n1diagnostic n1diagnostic,n1clipboarddiagnostic; do
            go test -race -tags "$tags" -count=1 "${packages[@]}"
            go vet -tags "$tags" "${packages[@]}"
            go build -tags "$tags" -trimpath -buildvcs=false \
              -o "$scratch/boxwarden-${tags}" ./cmd/boxwarden
          done
          if go build -tags n1candidate,n1diagnostic -o "$scratch/forbidden" ./cmd/boxwarden \
              >"$scratch/forbidden.log" 2>&1; then
            echo 'mutually exclusive diagnostic/candidate tags unexpectedly compiled' >&2
            exit 1
          fi
          if ! grep -Fq 'undefined: N1CandidateAndN1DiagnosticBuildTagsAreMutuallyExclusive' "$scratch/forbidden.log"; then
            cat "$scratch/forbidden.log" >&2
            echo 'forbidden-tag build did not reach the intentional mutual-exclusion sentinel' >&2
            exit 1
          fi

      - name: Vet
        if: ${{ hashFiles('go.mod') != '' }}
        run: go vet ./...

      - name: Build
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./cmd/boxwarden

  n1-packets:
    name: N1 deterministic packet policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check exact guest metadata filter with the Linux kernel
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/n1-qualification/guest_metadata_observer_test.py
      - name: Select pinned Rust compiler
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test pure packet policy without vmnet or privilege
        run: |
          rustup run 1.98.1 rustc --edition=2024 --test tools/n1-softnet/policy.rs -o "$RUNNER_TEMP/n1-policy-tests"
          "$RUNNER_TEMP/n1-policy-tests"
      - name: Test trial-only ARP observation without vmnet or privilege
        run: |
          rustup run 1.98.1 rustc --edition=2024 --test tools/n1-qualification/arp_observer.rs -o "$RUNNER_TEMP/n1-arp-observer-tests"
          "$RUNNER_TEMP/n1-arp-observer-tests"
      - name: Test exact upstream public/private classification
        shell: bash
        run: |
          curl --fail --location --max-time 60 --retry 2 \
            https://static.crates.io/crates/ip_network/ip_network-0.4.1.crate \
            --output "$RUNNER_TEMP/ip_network.crate"
          echo "aa2f047c0a98b2f299aa5d6d7088443570faae494e9ae1305e48be000c9e0eb1  $RUNNER_TEMP/ip_network.crate" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/ip_network.crate" -C "$RUNNER_TEMP"
          rustup run 1.98.1 rustc --edition=2018 --crate-type rlib --crate-name ip_network \
            "$RUNNER_TEMP/ip_network-0.4.1/src/lib.rs" -o "$RUNNER_TEMP/libip_network.rlib"
          rustup run 1.98.1 rustc --edition=2024 --test tools/n1-softnet/policy.rs \
            --cfg 'feature="pinned_fallback_test"' --extern "ip_network=$RUNNER_TEMP/libip_network.rlib" \
            -o "$RUNNER_TEMP/n1-policy-fallback-tests"
          "$RUNNER_TEMP/n1-policy-fallback-tests"

  n1-diagnostic-synthetic:
    name: N1 diagnostic synthetic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test locked diagnostic fixture in a neutral private workspace
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          rustup toolchain install 1.98.1 --profile minimal
          cargo="$(rustup which --toolchain 1.98.1 cargo)"
          rustc="$(rustup which --toolchain 1.98.1 rustc)"
          rustdoc="$(rustup which --toolchain 1.98.1 rustdoc)"
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$cargo" "$rustc" "$rustdoc" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          workspace, runner_temp, cargo, rustc, rustdoc = [
              Path(value).resolve(strict=True) for value in sys.argv[1:]
          ]
          if any(not Path(value).is_absolute() for value in sys.argv[1:]):
              raise SystemExit("absolute workspace and tool paths required")
          if cargo.parent != rustc.parent or cargo.parent != rustdoc.parent:
              raise SystemExit("Rust tools must belong to one selected toolchain")
          manifest = workspace / "tools/n1-diagnostic-softnet/synthetic/Cargo.toml"
          if not manifest.is_file() or not manifest.with_name("Cargo.lock").is_file():
              raise SystemExit("locked synthetic manifest required")
          root = Path(tempfile.mkdtemp(prefix="n1-diagnostic-", dir=runner_temp))
          os.chmod(root, 0o700)
          for name in ("home", "cargo-home", "target", "temp", "cwd"):
              (root / name).mkdir(mode=0o700)
          cwd = root / "cwd"
          if cwd == workspace or workspace in cwd.parents:
              raise SystemExit("neutral working directory required")
          for directory in (cwd, *cwd.parents):
              if any((directory / ".cargo" / name).exists()
                     for name in ("config", "config.toml")):
                  raise SystemExit("ambient Cargo configuration refused")
          environment = {
              "HOME": str(root / "home"),
              "CARGO_HOME": str(root / "cargo-home"),
              "CARGO_TARGET_DIR": str(root / "target"),
              "TMPDIR": str(root / "temp"),
              "PATH": str(cargo.parent) + os.pathsep + "/usr/bin:/bin",
              "RUSTC": str(rustc), "RUSTDOC": str(rustdoc),
              "LANG": "C", "LC_ALL": "C", "CARGO_BUILD_JOBS": "4",
              "CARGO_HTTP_TIMEOUT": "60", "CARGO_NET_RETRY": "2",
          }
          for tool, version in ((cargo, "cargo 1.98.1 "), (rustc, "rustc 1.98.1 ")):
              result = subprocess.run([str(tool), "--version"], cwd=cwd,
                                      env=environment, check=True, timeout=20,
                                      stdout=subprocess.PIPE, text=True)
              if not result.stdout.startswith(version):
                  raise SystemExit("selected Rust tool version mismatch")
              print(result.stdout.strip(), flush=True)
          common = [str(cargo), "--config",
                    'target.aarch64-apple-darwin.runner="/usr/bin/env"', "--config",
                    'target.x86_64-unknown-linux-gnu.runner="/usr/bin/env"']
          for arguments, offline, deadline in (
              (["fetch", "--locked", "--manifest-path", str(manifest)], "false", 240),
              (["test", "--locked", "--offline", "--manifest-path", str(manifest),
                "--lib"], "true", 300),
          ):
              argv = common + arguments
              child_environment = dict(environment, CARGO_NET_OFFLINE=offline)
              print(json.dumps({"argv_count": len(argv), "argv": argv,
                                "argv_hex": [os.fsencode(value).hex() for value in argv],
                                "cwd": str(cwd), "environment": child_environment,
                                "timeout_seconds": deadline}, sort_keys=True), flush=True)
              subprocess.run(argv, cwd=cwd, env=child_environment,
                             check=True, timeout=deadline)
          PYTHON
