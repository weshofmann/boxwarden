[package]
name = "softnet"
version = "0.19.0-boxwarden-n1-diagnostic.2"
publish = false
edition = "2024"

[lib]
path = "lib/mod.rs"

[profile.release-with-debug]
inherits = "release"
debug = true

[dependencies]
smoltcp = "0"
libc = "0"
polling = "3"
dhcproto = { git = "https://github.com/bluecatengineering/dhcproto.git", branch = "master" }
vmnet = "0.5.1"
clap = { version = "4", features = ["derive"] }
mac_address = "1"
privdrop = "0"
anyhow = { version = "1", features = ["backtrace"] }
ip_network = "0"
uzers = "0"
system-configuration = "0"
num_enum = "0"
nix = { version = "0", features = ["signal", "socket"] }
prefix-trie = "0"
ipnet = "2"
oslog = "0.2.0"
log = "0.4.29"
sentry = { version = "0", features = ["debug-images"] }
sentry-anyhow = { version = "0", features = ["backtrace"] }
serial_test = "3"
coarsetime = "0.1.37"


serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.128", default-features = false, features = ["std"] }
ring = "=0.17.14"

[profile.release]
debug = true
